data:
  model_dir: models
  processed_dir: data/processed
  random_state: 42
  raw_dir: data/raw
  test_file: test_transaction.csv
  test_size: 0.2
  train_file: train_transaction.csv
ensemble:
  default_threshold: 0.42570148755502263
evaluation:
  optimize_threshold: true
  primary_metric: pr_auc
  secondary_metrics:
  - roc_auc
  - precision
  - recall
  - f1
explainability:
  enabled: true
  shap_samples: 500
features:
  address:
    combinations: true
    enabled: true
  card:
    combinations: true
    enabled: true
  email:
    combinations: true
    enabled: true
  frequency:
    columns:
    - card1
    - card2
    - card3
    - card5
    - addr1
    - addr2
    - P_emaildomain
    - R_emaildomain
    enabled: true
  id_col: TransactionID
  identity:
    combinations: true
    enabled: true
  target_col: isFraud
  transaction:
    amount_bins: true
    amount_log: true
    time_features: true
  velocity:
    enabled: true
    windows:
    - 3600
    - 86400
    - 604800
models:
  catboost:
    auto_class_weights: Balanced
    depth: 6
    enabled: true
    eval_metric: AUC
    iterations: 500
    learning_rate: 0.05
    random_seed: 42
  lightgbm:
    colsample_bytree: 0.8
    enabled: true
    is_unbalance: true
    learning_rate: 0.05
    max_depth: -1
    metric: average_precision
    n_estimators: 500
    num_leaves: 31
    random_state: 42
    subsample: 0.8
  xgboost:
    colsample_bytree: 0.8
    enabled: true
    eval_metric: aucpr
    learning_rate: 0.05
    max_depth: 6
    n_estimators: 500
    random_state: 42
    scale_pos_weight: 9
    subsample: 0.8
optuna:
  direction: maximize
  enabled: true
  inner_validation_size: 0.2
  metric: pr_auc
  n_trials: 5
preprocessing:
  categorical_encoding: frequency
  missing_value_strategy: median
  scale_numeric: false
smote:
  enabled: true
  random_state: 42
  sampling_strategy: 0.3
training:
  early_stopping_rounds: 50
  verbose: true
