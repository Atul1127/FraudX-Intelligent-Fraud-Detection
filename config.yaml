data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  model_dir: "models"
  train_file: "train_transaction.csv"
  test_file: "test_transaction.csv"
  test_size: 0.2
  random_state: 42

features:
  target_col: "isFraud"
  id_col: "TransactionID"

  transaction:
    amount_log: true
    amount_bins: true
    time_features: true

  card:
    enabled: true
    combinations: true

  address:
    enabled: true
    combinations: true

  email:
    enabled: true
    combinations: true

  identity:
    enabled: true
    combinations: true

  velocity:
    enabled: true
    windows:
      - 3600
      - 86400
      - 604800

  frequency:
    enabled: true
    columns:
      - "card1"
      - "card2"
      - "card3"
      - "card5"
      - "addr1"
      - "addr2"
      - "P_emaildomain"
      - "R_emaildomain"

preprocessing:
  missing_value_strategy: "median"
  categorical_encoding: "frequency"
  scale_numeric: false

smote:
  enabled: true
  sampling_strategy: 0.3
  random_state: 42

models:
  xgboost:
    enabled: true
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 9
    random_state: 42
    eval_metric: "aucpr"

  lightgbm:
    enabled: true
    n_estimators: 500
    max_depth: -1
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    is_unbalance: true
    random_state: 42
    metric: "average_precision"

  catboost:
    enabled: true
    iterations: 500
    depth: 6
    learning_rate: 0.05
    auto_class_weights: "Balanced"
    random_seed: 42
    eval_metric: "AUC"

ensemble:
  default_threshold: 0.34561272049284264

evaluation:
  primary_metric: "pr_auc"
  secondary_metrics:
    - "roc_auc"
    - "precision"
    - "recall"
    - "f1"

  optimize_threshold: true

explainability:
  enabled: true
  shap_samples: 500

training:
  early_stopping_rounds: 50
  verbose: true

optuna:
  enabled: true
  n_trials: 5
  direction: "maximize"
  metric: "pr_auc"
