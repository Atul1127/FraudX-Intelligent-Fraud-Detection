services:
  mongodb:
    image: mongo:8
    container_name: fraudx-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - fraudx-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraudx-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: fraudx
    depends_on:
      mongodb:
        condition: service_healthy

  mlflow:
    image: python:3.12-slim
    container_name: fraudx-mlflow
    restart: unless-stopped
    working_dir: /mlflow
    ports:
      - "5000:5000"
    volumes:
      - fraudx-mlflow-data:/mlflow
    command: >-
      sh -c "pip install --no-cache-dir mlflow>=3.0 &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts"

volumes:
  fraudx-mongo-data:
  fraudx-mlflow-data:
