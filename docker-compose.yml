services:
  mongodb:
    image: mongo:8
    container_name: fraudx-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - fraudx-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraudx-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: fraudx
    depends_on:
      mongodb:
        condition: service_healthy

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: fraudx-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - fraudx-mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  fraudx-mongo-data:
  fraudx-mlflow-data:
