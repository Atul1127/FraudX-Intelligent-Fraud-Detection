services:
  mongodb:
    image: mongo:8
    container_name: fraudx-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - fraudx-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraudx-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: fraudx
    depends_on:
      mongodb:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: fraudx-mlflow
    restart: unless-stopped
    working_dir: /mlflow
    ports:
      - "5000:5000"
    volumes:
      - fraudx-mlflow-data:/mlflow
    command: >-
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  fraudx-mongo-data:
  fraudx-mlflow-data:
